<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Goals Visual Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0f172a;
      color: #e5e7eb;
      font-family: system-ui, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: -webkit-fill-available;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .app {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    h2 {
      text-align: center;
      margin: 16px 0;
    }

    .chart-area {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px;
      padding-bottom: calc(70px + env(safe-area-inset-bottom));
      min-height: 0;
    }

    .canvas-wrapper {
      width: 100%;
      max-width: 600px;
      aspect-ratio: 1 / 1;
      position: relative;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>

<body>
  <div class="app">
    <h2>6 years of non stop meditation</h2>

    <div class="chart-area">
      <div class="canvas-wrapper">
        <canvas id="meditationChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    const ctx = document.getElementById("meditationChart");

    /* Gradient */
    const gradient = ctx.getContext("2d").createLinearGradient(0, 0, 0, 300);
    gradient.addColorStop(0, "#bbf7d0");
    gradient.addColorStop(0.5, "#86efac");
    gradient.addColorStop(1, "#4ade80");

    /* Hard-coded times */
    const startTime = new Date("2026-05-16 16:00:00");
    const endTime   = new Date("2032-05-16 16:00:00");

    const goalHours = 10000;

    /* Create chart ONCE */
    const chart = new Chart(ctx, {
      type: "doughnut",
      data: {
        labels: ["Done", "Remaining"],
        datasets: [
          {
            data: [0, goalHours],
            backgroundColor: [gradient, "#1f2933"],
            borderWidth: 0,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: "70%",
        plugins: { legend: { display: false } }
      }
    });

    function updateChart() {
      const now = new Date();
      const total = endTime - startTime;
      const elapsed = now - startTime;

      const progress = Math.max(0, Math.min(elapsed / total, 1));

      const done = progress * goalHours;
      const remaining = goalHours - done;

      chart.data.datasets[0].data = [done, remaining];
      chart.update();
    }

    /* Run immediately */
    updateChart();

    /* Update every second WITHOUT recreating chart */
    setInterval(updateChart, 1000);
  </script>
</body>
</html>
